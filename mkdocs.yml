site_name: Number Theory
site_description: A practical Number Theory knowledge base for Competitive Programming.
site_url: https://baraafanah21.github.io/NumberTheory/
repo_url: https://github.com/baraafanah21/NumberTheory
repo_name: baraafanah21/NumberTheory
edit_uri: edit/main/
copyright: MIT License

# The Markdown lives next to this file, so it can be read on GitHub as-is.
docs_dir: .
# MkDocs skips /templates/ by default; here it holds content, not theme templates.
exclude_docs: |
  !/templates/
  /.github/
  /hooks/
  /venv/
  /.venv/
  /LICENSE
  /requirements-docs.txt
  *.cpp

not_in_nav: |
  /problems/TEMPLATE.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - same-dir
  - search

hooks:
  - hooks/links.py

markdown_extensions:
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - tables
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

